<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Afrihealth Innovation Challenge</title>
    <meta
      name="description"
      content="A public portal for the Afrihealth Innovation Challenge dashboard"
    />
    <link rel="icon" type="image/png" href="logo.png" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
      rel="stylesheet"
    />
  </head>
  <body font-family="Nunito, sans-serif">
    <div class="portal-shell">
      <header class="portal-hero">
        <img
          class="site-logo"
          src="logo.png"
          alt="Afrihealth Innovation Challenge 2026"
        />
      </header>

      <main class="home-layout">
        <section class="portal-card portal-intro" id="highlights">
          <p class="eyebrow" style="text-align: center">
            Peoples Choice Award:
            <a href="https://the-cube.co.ke/peoples-choice" target="_blank"
              >Vote Here!</a
            >
          </p>
          <br />
          <br />
          <div class="pill-row">
            <span class="pill">Live schedule</span>
            <span class="pill">Speaker lineup</span>
            <span class="pill">Breakout rooms</span>
          </div>
        </section>

        <section class="panel list-panel home-schedule" id="schedule">
          <div class="toolbar">
            <div>
              <p class="eyebrow">Program</p>
              <h2>All sessions</h2>
            </div>
            <input type="search" id="search" placeholder="Search sessions" />
          </div>

          <div class="day-toggle" role="tablist" aria-label="Day view">
            <button
              type="button"
              class="day-filter active"
              data-day-filter="all"
            >
              All Days
            </button>
            <button
              type="button"
              class="day-filter"
              data-day-filter="2026-07-23"
            >
              Day 1
            </button>
            <button
              type="button"
              class="day-filter"
              data-day-filter="2026-07-24"
            >
              Day 2
            </button>
          </div>

          <div class="room-toggle" role="tablist" aria-label="Room view">
            <button
              type="button"
              class="room-filter active"
              data-room-filter="all"
            >
              All
            </button>
            <button
              type="button"
              class="room-filter"
              data-room-filter="main hall"
            >
              Main Hall
            </button>
            <button
              type="button"
              class="room-filter"
              data-room-filter="breakout"
            >
              Breakout Room
            </button>
          </div>

          <div class="stats" id="stats"></div>
          <div id="session-list" class="session-list"></div>
        </section>
      </main>

      <footer class="site-footer">
        <p>
          <b
            >Developed and Powered by
            <a href="https://devnest.africa" target="_blank">DevNest KE</a></b
          >
        </p>
      </footer>
    </div>

    <script src="app.js"></script>
  </body>
</html>
